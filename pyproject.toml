[project]
name = "xiaomi-cli"
version = "0.1.0"
description = "小米云笔记 / 待办 CLI"
readme = "README.md"
authors = [
    { name = "Lawsiki", email = "keeperxu@foxmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dateutil>=2.9.0",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[project.scripts]
xiaomi-cli = "xiaomi_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
